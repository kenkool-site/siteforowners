name = "memories-processing"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[[queues.consumers]]
queue = "memories-processing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "memories-processing-dlq"

[[r2_buckets]]
binding = "MEMORIES_BUCKET"
bucket_name = "invitespot-memories"
